name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write # the cron step merges via the pull request merge endpoint
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: evaluate
        uses: cmiic/dependabot-automation/merge@32fff813484d5e646c25a1b6fab3818edf944191 # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"

      - if: steps.evaluate.outputs.candidate == 'true' && steps.evaluate.outputs.quarantine-passed == 'true'
        uses: cmiic/dependabot-automation/cron@32fff813484d5e646c25a1b6fab3818edf944191 # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
