name: PowerShell Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwsh-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $hadErrors = $false

          Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' -and $_.FullName -notmatch '[\\/]\.git[\\/]'} | ForEach-Object {
            $tokens = $null
            $errors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $hadErrors = $true
              Write-Host "::error file=$($_.FullName)::PowerShell syntax validation failed"

              $errors | ForEach-Object {
                Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber),col=$($_.Extent.StartColumnNumber)::$($_.Message)"
              }
            }
          }

          if ($hadErrors) {
            throw "PowerShell syntax validation failed."
          }

      - name: Enforce the IntuneInterop boundary
        shell: pwsh
        run: |
          # Only IntuneInterop.ps1 may call IntuneWin32App cmdlets or assign the module's
          # global auth state. AST-based, so comments and doc prose mentioning the module
          # do not trip the check, and reads of the globals are not flagged.
          $violationCount = 0
          $authGlobals = @('Global:AuthenticationHeader', 'Global:AccessToken', 'Global:AccessTokenTenantID')

          Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' -and $_.Name -ne 'IntuneInterop.ps1' -and $_.FullName -notmatch '[\\/]\.git[\\/]' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            $calls = $ast.FindAll({ param($node)
              $node -is [System.Management.Automation.Language.CommandAst] -and
              $node.GetCommandName() -match '-IntuneWin32App'
            }, $true)

            foreach ($call in $calls) {
              $violationCount++
              Write-Host "::error file=$($_.FullName),line=$($call.Extent.StartLineNumber)::IntuneWin32App cmdlet called outside IntuneInterop.ps1: $($call.GetCommandName())"
            }

            $authAssignments = $ast.FindAll({ param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst]
            }, $true) | Where-Object {
              $_.Left.FindAll({ param($n)
                $n -is [System.Management.Automation.Language.VariableExpressionAst] -and
                $n.VariablePath.UserPath -in $authGlobals
              }, $true).Count -gt 0
            }

            foreach ($assignment in $authAssignments) {
              $violationCount++
              Write-Host "::error file=$($_.FullName),line=$($assignment.Extent.StartLineNumber)::Module auth global assigned outside IntuneInterop.ps1: $($assignment.Left.Extent.Text)"
            }
          }

          if ($violationCount -gt 0) {
            throw "IntuneWin32App module usage must go through IntuneInterop.ps1 ($violationCount violation(s))."
          }

  pester:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versions are pinned so the golden-config tests (which execute the real
      # IntuneWin32App rule builders) stay deterministic. Bump them deliberately.
      - name: Install test dependencies
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name IntuneWin32App -RequiredVersion 1.5.0 -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.0.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'LocalOnly'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
