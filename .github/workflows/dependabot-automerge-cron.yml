name: Dependabot Auto-merge (Cron)

on:
  schedule:
    # Run at 00:31, 08:31, and 16:31 UTC
    - cron: '31 0,8,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-aged-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: cmiic/dependabot-automation/cron@32fff813484d5e646c25a1b6fab3818edf944191 # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
